services:
  - type: web
    name: astrohealth
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/train_model.py
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
